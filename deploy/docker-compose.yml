# ==============================================================================
# MindForge Web 生产 Docker Compose 编排文件
# ==============================================================================

version: '3.8'

services:
  mindforge-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: mindforge-web
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 可选：将宿主机的自定义 nginx.conf 挂载进容器以支持灵活配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 可选：SSL 证书目录挂载
      # - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
      # 允许容器直接访问宿主机上的后端服务 (127.0.0.1:8080)
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
