# ==============================================================================
# MindForge Web 生产 Nginx 配置（HTTPS 部署用）
#
# 与 deploy/nginx.conf 的差异（4 处，均有 ★ 标记）：
#   1. ★ 新增 /api/internal/ 拦截 —— Java 的内部接口完整路径是 /api/internal/**，
#      原 conf 会把它代理到公网，等于把「无用户态、只认共享令牌」的内部 API
#      直接暴露出去（令牌一泄漏全部文档管道沦陷）。必须在外层直接 403。
#   2. ★ client_max_body_size 30m → 50m，与 Spring 的 max-file-size: 50MB 对齐。
#      不对齐的话 30~50MB 的简历会被 Nginx 先拒掉（413），后端配置形同虚设。
#   3. ★ server_name 说明改为香港地域免备案场景。
#   4. ★ 注释掉 Docker 相关歧义：本 conf 按「Nginx 装在宿主机」编写，
#      upstream 用 127.0.0.1:8080 是对的；若跑在容器里必须改 host.docker.internal。
#
# HTTPS：先用本 conf（仅 80）跑通，然后执行
#   sudo certbot --nginx -d <你的域名>
# certbot 会自动改写本文件补上 443 和 301 跳转，不需要手工配。
# ==============================================================================

upstream java_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    # ★ 香港地域免备案。把 mindforge.example.com 换成你的真实域名；
    #   暂时没有域名就写 _（用 IP 访问），上了 HTTPS 前提是有域名。
    server_name mindforge.example.com;

    # 客户端上传限制 —— ★ 与 Spring 的 multipart max-file-size 50MB 对齐
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 前端构建产物（部署结构见 DEPLOY.md）：
    # /var/www/mindforge/
    # ├── user/      <- apps/user/dist
    # └── admin/     <- apps/admin/dist
    root /var/www/mindforge;

    # --------------------------------------------------------------------------
    # 0. ★ 内部 API 拦截（必须放在 /api/ 之前 —— Nginx 按最长前缀匹配，
    #      ^~ 使其优先于下面的 /api/ 块生效）
    # --------------------------------------------------------------------------
    location ^~ /api/internal/ {
        # 只允许 Java↔Python 在本机互调（它们走 127.0.0.1，不经过 Nginx），
        # 从公网打到这里的都是扫描器，直接 403
        return 403;
    }

    # --------------------------------------------------------------------------
    # 1. 管理端（/admin/）
    # --------------------------------------------------------------------------
    location ^~ /admin/ {
        # 管理端 IP 白名单（推荐按需放开）
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # deny all;

        alias /var/www/mindforge/admin/;
        index index.html;

        # History 路由回退
        try_files $uri $uri/ /admin/index.html;

        # 入口 HTML 禁止缓存，发布即时生效
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 管理端带 hash 静态资源长期缓存
    location ^~ /admin/assets/ {
        alias /var/www/mindforge/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. 用户端（/）
    # --------------------------------------------------------------------------
    location / {
        root /var/www/mindforge/user;
        index index.html;

        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 用户端带 hash 静态资源长期缓存
    location ^~ /assets/ {
        root /var/www/mindforge/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. 后端 API 反向代理（/api/）
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://java_backend;
        proxy_http_version 1.1;

        # ★ X-Forwarded-For 等转发头 + Java 侧 trust-forwarded-headers: true，
        #   两者配合限流/登录失败计数才能按真实客户端 IP 生效
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        # AI 类长接口（简历优化实测可到 8 分钟）—— 与 Java 的 read-timeout 660s 对齐
        proxy_read_timeout 660s;

        # SSE 流式对话：关缓冲是硬要求，开了前端就收不到逐 token 输出
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 统一安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
