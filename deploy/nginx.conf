# ==============================================================================
# MindForge Web 生产部署 Nginx 配置文件
#
# 架构说明：
# - 前端一仓两端（Monorepo）：
#     - 用户端（apps/user）：静态资源挂载于 root 目录，Base 路径为 /
#     - 管理端（apps/admin）：静态资源挂载于 /admin/，Base 路径为 /admin/
# - 后端服务：
#     - Java 后端（mindforge-ai）：运行于 127.0.0.1:8080，统一 context-path 为 /api
# ==============================================================================

# 定义后端负载均衡与上游连接
upstream java_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name mindforge.yourdomain.com;

    # 生产建议强制重定向至 HTTPS（如已配置证书，解开下列注释）
    # return 301 https://$host$request_uri;

    # 客户端上传限制（匹配简历与文档上传限制，默认 30MB）
    client_max_body_size 30m;

    # Gzip 高性能压缩配置
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 前端构建产物根路径（请按实际服务器部署目录调整）
    # 约定部署结构：
    # /var/www/mindforge/
    # ├── user/      <- apps/user/dist 产物
    # └── admin/     <- apps/admin/dist 产物
    root /var/www/mindforge;

    # --------------------------------------------------------------------------
    # 1. 管理端（/admin/）
    # --------------------------------------------------------------------------
    location ^~ /admin/ {
        # ⚠️ 安全加固：管理端支持 IP 白名单访问控制（生产推荐放开以下限制）
        # allow 192.168.1.0/24;  # 允许公司内网 / VPN 网段
        # allow 10.0.0.0/8;
        # deny all;              # 拒绝其它外部公网 IP

        alias /var/www/mindforge/admin/;
        index index.html;

        # History 路由模式支持：找不到文件时回退到 admin/index.html
        try_files $uri $uri/ /admin/index.html;

        # 入口 HTML 禁止缓存，确保前端发布后立即生效（防 FOUC 和旧版本残留）
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 管理端带 hash 静态资源长期缓存
    location ^~ /admin/assets/ {
        alias /var/www/mindforge/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. 用户端（/）
    # --------------------------------------------------------------------------
    location / {
        root /var/www/mindforge/user;
        index index.html;

        # History 路由模式支持：找不到文件时回退到 index.html
        try_files $uri $uri/ /index.html;

        # 入口 HTML 禁止强缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # 用户端带 hash 静态资源长期缓存
    location ^~ /assets/ {
        root /var/www/mindforge/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. 后端 API 反向代理（/api/）
    # --------------------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://java_backend;
        proxy_http_version 1.1;

        # 透传客户端真实网络信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s; # AI 优化与匹配属于长接口，超时放宽至 5 分钟

        # ----------------------------------------------------------------------
        # SSE (Server-Sent Events) 流式对话特殊支持
        # 针对 AI 问答流式输出（/api/app/conversations/*/messages/stream）
        # ----------------------------------------------------------------------
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 统一安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
