packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ 默认【禁止依赖执行安装脚本】（防供应链投毒）——
# 这是好事，但有两个包必须跑：
#   esbuild   —— 要落平台二进制，不跑的话 vite 起不来
#   vue-demi  —— 要给 Vue 2/3 做补丁
# 所以显式放行这两个，其余仍然拦住。
# ⚠️ pnpm 12 起这个设置【只认 pnpm-workspace.yaml】，写在 package.json 的 pnpm 字段里会被忽略。
allowBuilds:
  esbuild: true
  vue-demi: true
